# Render Blueprint: one web service that runs the API, the league scheduler
# and serves the built web app. The database is your Supabase project.
#
# In Render: New → Blueprint → pick this repo. You'll be asked for DATABASE_URL
# (Supabase → Connect → "Session pooler" connection string). See DEPLOY.md.
services:
  - type: web
    name: hockey-gm
    runtime: node
    # Starter keeps the server awake, which scheduled leagues need. On the free
    # plan it sleeps after 15 idle minutes (fine for commissioner-advanced leagues).
    plan: starter
    # Pick the region closest to your Supabase project (virginia for ca-central-1 / us-east-1).
    region: virginia
    branch: main
    # Dev dependencies are needed to build the web app and to run the TypeScript server.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
